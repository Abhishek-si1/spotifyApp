<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify - Webplayer: Music for everyone</title>

    <meta name="description"
        content="Listen to your favorite music online with Spotify Webplayer. Enjoy a seamless music experience on any device.">
    <meta name="keywords" content="Spotify, web player, music, online music, playlists, artists">
    <meta name="author" content="Abhishek Singh">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
<div class="container bg-black flex">

    <!-- =====================
         LEFT SIDEBAR
         ===================== -->
    <aside class="left">
        <button class="close invert" aria-label="Close sidebar">
            <img src="img/close.svg" alt="">
        </button>

        <img class="invert logo" width="150" src="img/logo.svg" alt="Spotify Logo">

        <!-- Navigation -->
        <nav class="home bg-grey rounded m-1 p-1">
            <ul>
                <li>
                    <img class="home invert" src="img/home.svg"> Home
                </li>
                <li>
                    <img class="search invert" src="img/search.svg"> Search
                </li>
            </ul>
        </nav>

        <!-- Library -->
        <section class="library bg-grey rounded m-1 p-1">
            <div class="heading flex">
                <img class="invert" src="img/playlist.svg">
                <h2>Your Library</h2>
            </div>

            <!-- Song List (EMPTY BY DEFAULT) -->
            <div class="songList">
                <ul id="songList">
                    <li>Select a playlist to view songs</li>
                </ul>
            </div>

            <!-- Footer Links -->
            <footer class="footer">
                <a href="https://www.spotify.com/jp/legal/">Legal</a>
                <a href="https://www.spotify.com/jp/privacy/">Privacy Center</a>
                <a href="https://www.spotify.com/jp/legal/privacy-policy/">Privacy Policy</a>
                <a href="https://www.spotify.com/jp/legal/cookies-policy/">Cookies</a>
                <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">About Ads</a>
                <a href="https://www.spotify.com/jp/accessibility/">Accessibility</a>
            </footer>
        </section>
    </aside>

    <!-- =====================
         RIGHT CONTENT
         ===================== -->
    <main class="right bg-grey rounded">

        <!-- Header -->
        <header class="rounded p-1 flex header">
            <div class="nav flex arrowburger">
                <img class="hamburger" src="img/hamburger.svg">

                <!-- Arrows -->
                <svg class="arrows" width="24" height="24" viewBox="0 0 24 24">
                    <path d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <svg class="arrows" width="24" height="24" viewBox="0 0 24 24">
                    <path d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="button">
                <button class="signupBtn">Sign up</button>
                <button class="loginBtn"
                    onclick="window.location.href='loginindex.html'">Log in</button>
            </div>
        </header>

        <!-- Playlist Cards -->
        <section class="spotifyPlaylists">
            <h1>Spotify Playlists</h1>
            <div class="cardContainer flex">
                <!-- Cards injected by JS -->
            </div>
        </section>

        <!-- =====================
             PLAYER BAR
             ===================== -->
        <section class="playbar">

            <div class="flex aboveBar">
                <!-- Inactive state text -->
                <div class="songInfo">Select a playlist to start listening</div>

                <div class="invert songButton">
                    <img id="shuffle" src="img/shuffle.svg">
                    <img id="previous" src="img/prevsong.svg">
                    <img id="play" src="img/play.svg">
                    <img id="next" src="img/nextsong.svg">
                    <img id="loop" src="img/loop.svg">
                </div>

                <div class="songTimer">00:00 / 00:00</div>
            </div>

            <div class="belowBar flex">
                <div class="seekbar">
                    <div class="circle"></div>
                </div>

                <div class="volume-control-container">
                    <img id="unmute" class="invert" src="img/volume.svg">
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                    <span id="volume-display">50%</span>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="js/script1.js" defer></script>
</body>
</html>
