<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bar {
      transform-origin: bottom;
    }
    .bar:nth-child(1) { animation: bounce 0.9s ease-in-out infinite; animation-delay: 0s; }
    .bar:nth-child(2) { animation: bounce 0.9s ease-in-out infinite; animation-delay: 0.1s; }
    .bar:nth-child(3) { animation: bounce 0.9s ease-in-out infinite; animation-delay: 0.2s; }
    .bar:nth-child(4) { animation: bounce 0.9s ease-in-out infinite; animation-delay: 0.3s; }
    .bar:nth-child(5) { animation: bounce 0.9s ease-in-out infinite; animation-delay: 0.4s; }

    @keyframes bounce {
      0%   { transform: scaleY(0.2); }
      25%  { transform: scaleY(0.9); }
      50%  { transform: scaleY(0.4); }
      75%  { transform: scaleY(0.7); }
      100% { transform: scaleY(0.3); }
    }
  </style>

  <rect class="bar" x="20"  y="20" width="20" height="80" fill="#6EE7F9" rx="3"/>
  <rect class="bar" x="50"  y="20" width="20" height="80" fill="#22D3EE" rx="3"/>
  <rect class="bar" x="80"  y="20" width="20" height="80" fill="#0EA5E9" rx="3"/>
  <rect class="bar" x="110" y="20" width="20" height="80" fill="#0284C7" rx="3"/>
  <rect class="bar" x="140" y="20" width="20" height="80" fill="#0369A1" rx="3"/>
</svg>
